<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cronograma de gravação — Protótipo Funcional</title>
<meta name="description" content="Status de produção das aulas do Protótipo Funcional — o que está em backlog, roteiro, gravação, edição e publicação.">
<meta name="theme-color" content="#1c1c1c">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="ico.svg">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Kode+Mono:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Kode+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  /* Custom Cursor */
  .cursor{position:fixed;top:0;left:0;width:28px;height:32px;pointer-events:none;z-index:9999;opacity:0;transform:translate3d(-100px,-100px,0);transition:opacity .25s ease;will-change:transform}
  .cursor-svg{display:block;width:100%;height:100%;background:url('cursor.svg') no-repeat top left/contain;transform-origin:0 0;transform:scale(1);transition:transform .22s cubic-bezier(.34,1.56,.64,1),filter .25s ease;filter:drop-shadow(0 0 2px rgba(212,245,66,0.7)) drop-shadow(0 0 10px rgba(212,245,66,0.5)) drop-shadow(0 0 22px rgba(212,245,66,0.3)) drop-shadow(0 2px 8px rgba(0,0,0,0.55))}
  .cursor.is-active{opacity:1}
  .cursor.is-hover .cursor-svg{transform:scale(1.4);filter:drop-shadow(0 0 3px rgba(212,245,66,0.95)) drop-shadow(0 0 14px rgba(212,245,66,0.7)) drop-shadow(0 0 32px rgba(212,245,66,0.45)) drop-shadow(0 2px 8px rgba(0,0,0,0.6))}
  .cursor.is-down .cursor-svg{transform:scale(0.85)}
  body.has-custom-cursor,body.has-custom-cursor *{cursor:none !important}
  @media (hover:none),(prefers-reduced-motion:reduce){.cursor{display:none}}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

  :root{
    --bg:#1c1c1c;
    --bg-soft:#1d1d1d;
    --bg-card:#242424;
    --bg-elev:#2e2e2e;
    --border:#2e2e2e;
    --border-light:#383838;
    --text:#f0e7da;
    --text-cream:#e9e0d1;
    --text-dim:#ccbd9f;
    --text-mute:#9c9180;
    --accent:#D4F542;
    --accent-bright:#DFFA5C;
    --accent-dim:#B8D930;
    --radius:12px;
    --radius-sm:6px;
    --max:1240px;
  }
  html,body{background:var(--bg);color:var(--text);font-family:'Geist','Inter',-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  img,svg{display:block;max-width:100%}
  .container{max-width:var(--max);margin:0 auto;padding:0 24px}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Kode Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim);padding:6px 12px;border:1px solid var(--border-light);border-radius:999px;background:var(--bg-soft)}
  .eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(212,245,66,0.55);animation:dotPulse 2s cubic-bezier(.4,0,.6,1) infinite;flex-shrink:0}
  @keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(212,245,66,0.55),0 0 6px rgba(212,245,66,0.4)}70%{box-shadow:0 0 0 8px rgba(212,245,66,0),0 0 14px rgba(212,245,66,0.6)}100%{box-shadow:0 0 0 0 rgba(212,245,66,0),0 0 6px rgba(212,245,66,0.4)}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-family:'Kode Mono',monospace;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s ease,border-color .25s ease,box-shadow .25s ease,color .2s ease;white-space:nowrap;line-height:1}
  .btn-ghost{color:var(--text);border-color:var(--border-light)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px);box-shadow:0 12px 28px rgba(212,245,66,0.12)}

  /* Top bar */
  .cron-top{position:sticky;top:0;z-index:40;background:rgba(20,20,20,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  .cron-top .container{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
  .cron-logo img{height:26px;width:auto}
  .cron-back{display:inline-flex;align-items:center;gap:8px;font-family:'Kode Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim);transition:color .2s}
  .cron-back:hover{color:var(--accent)}

  /* Header */
  .cron-header{text-align:center;padding:64px 0 32px}
  .cron-header .eyebrow{margin-bottom:20px}
  .cron-header h1{font-size:clamp(32px,4.5vw,52px);font-weight:600;letter-spacing:-0.03em;line-height:1.05;margin:0 auto 16px;max-width:820px}
  .cron-header p{color:var(--text-dim);max-width:560px;margin:0 auto;font-size:16px}

  /* Stats / progresso */
  .cron-stats{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding:22px 24px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:28px}
  .cron-progress-wrap{flex:1 1 320px;min-width:260px}
  .cron-progress-head{display:flex;justify-content:space-between;align-items:baseline;font-family:'Kode Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-mute);margin-bottom:10px}
  .cron-progress-head strong{color:var(--accent);font-size:14px}
  .cron-progress{height:8px;border-radius:999px;background:var(--bg-elev);overflow:hidden}
  .cron-progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-dim),var(--accent));width:0;transition:width .8s cubic-bezier(.22,.61,.36,1)}
  .cron-meta{display:flex;flex-wrap:wrap;gap:8px}
  .cron-pill{font-family:'Kode Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim);border:1px solid var(--border-light);background:var(--bg-soft);padding:7px 12px;border-radius:999px}

  /* Filtros */
  .cron-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
  .cron-chip{display:inline-flex;align-items:center;gap:8px;font-family:'Kode Mono',monospace;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim);border:1px solid var(--border-light);background:var(--bg-soft);padding:8px 14px;border-radius:999px;transition:border-color .2s,color .2s,background .2s}
  .cron-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--m,var(--accent));flex-shrink:0}
  .cron-chip:hover{color:var(--text);border-color:var(--text-mute)}
  .cron-chip.is-on{color:var(--text);border-color:var(--m,var(--accent));background:color-mix(in srgb,var(--m,var(--accent)) 12%,transparent)}

  /* Board */
  .cron-board-wrap{padding-bottom:80px}
  .cron-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:start}
  .cron-col{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-height:220px}
  .cron-col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px;border-bottom:1px solid var(--border)}
  .cron-col-name{font-family:'Kode Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim)}
  .cron-col-count{font-family:'Kode Mono',monospace;font-size:11px;font-weight:600;min-width:24px;height:24px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-elev);color:var(--text-mute)}
  .cron-col[data-col="publicacao"] .cron-col-name{color:var(--accent)}
  .cron-col[data-col="publicacao"] .cron-col-count{background:var(--accent);color:#1c1c1c}
  .cron-col-body{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
  .cron-empty{flex:1;display:flex;align-items:center;justify-content:center;min-height:80px;font-family:'Kode Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-mute);opacity:.5}

  /* Card de aula */
  .cron-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:9px;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
  .cron-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,0.35)}
  .cron-card[hidden]{display:none}
  .cron-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cron-mod{font-family:'Kode Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--m,var(--accent));border:1px solid var(--m,var(--accent));padding:3px 7px;border-radius:999px;line-height:1;white-space:nowrap}
  .cron-date{font-family:'Kode Mono',monospace;font-size:10px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-mute);white-space:nowrap}
  .cron-card-title{font-size:13px;line-height:1.4;color:var(--text);font-weight:500}
  .cron-card-num{font-family:'Kode Mono',monospace;font-size:10px;color:var(--text-mute);letter-spacing:0.04em}

  @media (max-width:1100px){
    .cron-board{display:flex;overflow-x:auto;gap:14px;padding-bottom:14px;scroll-snap-type:x proximity}
    .cron-col{flex:0 0 260px;scroll-snap-align:start}
  }
  @media (max-width:640px){
    .cron-header{padding:40px 0 24px}
    .cron-stats{flex-direction:column;align-items:stretch}
    .cron-col{flex:0 0 82vw}
  }
</style>
</head>
<body>
<div class="cursor" aria-hidden="true"><span class="cursor-svg"></span></div>

<header class="cron-top">
  <div class="container">
    <a class="cron-logo" href="index.html" aria-label="Voltar para o site"><img src="logo-prototipo-funcional.svg" alt="Protótipo Funcional" /></a>
    <a class="cron-back" href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Voltar ao site</a>
  </div>
</header>

<main>
  <div class="container">
    <div class="cron-header">
      <span class="eyebrow">Cronograma</span>
      <h1>Cronograma de gravação</h1>
    </div>

    <!-- Stats / progresso (preenchido via JS) -->
    <div class="cron-stats">
      <div class="cron-progress-wrap">
        <div class="cron-progress-head"><span>Progresso de produção</span><span id="cronProgressLabel"><strong>0</strong>/0 aulas · 0%</span></div>
        <div class="cron-progress"><div class="cron-progress-bar" id="cronProgressBar"></div></div>
      </div>
      <div class="cron-meta">
        <span class="cron-pill" id="cronTotal">— aulas</span>
        <span class="cron-pill">6 módulos</span>
        <span class="cron-pill">Previsão: set/2026</span>
      </div>
    </div>

    <!-- Filtros por módulo (preenchido via JS) -->
    <div class="cron-filters" id="cronFilters"></div>
  </div>

  <!-- Board kanban (preenchido via JS) -->
  <div class="container cron-board-wrap">
    <div class="cron-board" id="cronBoard"></div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  /* ===== Fonte da verdade: aulas e status de produção =====
     status ∈ backlog | roteiro | gravacao | edicao | publicacao
     Hoje: Módulo 1 publicado; demais em backlog. Edite aqui para mover. */
  const MODULES={0:'Introdução',1:'Princípios e framework',2:'Componentes funcionais',3:'Fluxos completos com agentes de código',4:'Dados de teste e estados visuais',5:'Features de IA e integrações',6:'Build, deploy e mobile'};
  const MOD_COLORS={0:'#B9AF9C',1:'#D4F542',2:'#5CC8FF',3:'#B69CFF',4:'#FF8FB1',5:'#FFB14E',6:'#4ED7A0'};
  // Previsões são placeholders — ajuste à vontade.
  const FORECAST={0:'mai/26',2:'jun/26',3:'jul/26',4:'ago/26',5:'ago/26',6:'set/26'};

  const lessons=[
    {mod:0,n:1,title:'Boas-vindas',status:'roteiro'},
    {mod:0,n:2,title:'Sobre o cronograma das aulas',status:'roteiro'},
    {mod:0,n:3,title:'Canais de ajuda',status:'roteiro'},
    {mod:null,title:'Vídeo de apresentação do curso',status:'gravacao',date:'mai/26'},
    {mod:1,n:1,title:'O que são os Protótipos Funcionais',status:'publicacao'},
    {mod:1,n:2,title:'Como a história trouxe a gente da máquina até o código',status:'publicacao'},
    {mod:1,n:3,title:'Por que usar código para fazer design & não vamos abandonar o Figma',status:'publicacao'},
    {mod:1,n:4,title:'Os 4 níveis de protótipos',status:'publicacao'},
    {mod:1,n:5,title:'Protótipos Interativos X Protótipos Funcionais',status:'publicacao'},
    {mod:1,n:6,title:'4 erros de usar IA no processo de design (que não vamos cometer)',status:'publicacao'},
    {mod:2,n:1,title:'Panorama das ferramentas opinativas',status:'gravacao'},
    {mod:2,n:2,title:'Componente 1: tabela com filtros',status:'gravacao'},
    {mod:2,n:3,title:'Componente 2: drag and drop',status:'gravacao'},
    {mod:2,n:4,title:'Componente 3: feedback dinâmico',status:'gravacao'},
    {mod:3,n:1,title:'Setup do ambiente',status:'roteiro'},
    {mod:3,n:2,title:'O repositório base e a primeira tela',status:'roteiro'},
    {mod:3,n:3,title:'Estado na memória: useState e useReducer',status:'backlog'},
    {mod:3,n:4,title:'Estado na sessão: persistência sem backend',status:'backlog'},
    {mod:3,n:5,title:'Banco de dados real com Supabase',status:'backlog'},
    {mod:4,n:1,title:'Por que dado mock importa',status:'backlog'},
    {mod:4,n:2,title:'Faker.js: dados realistas em escala',status:'backlog'},
    {mod:4,n:3,title:'Mock Service Worker (MSW): simulando uma API',status:'backlog'},
    {mod:4,n:4,title:'O admin de perfis de teste',status:'backlog'},
    {mod:4,n:5,title:'O overlay de estados visuais',status:'backlog'},
    {mod:5,n:1,title:'Features de IA, não telas de IA',status:'backlog'},
    {mod:5,n:2,title:'LLM API: criando uma feature de IA que funciona',status:'backlog'},
    {mod:5,n:3,title:'Streaming: por que importa e como implementar',status:'backlog'},
    {mod:5,n:4,title:'Custo, rate limit, fallback',status:'backlog'},
    {mod:5,n:5,title:'Integrando uma API REST pública',status:'backlog'},
    {mod:5,n:6,title:'Padrões de UX para features generativas',status:'backlog'},
    {mod:6,n:1,title:'Build local e otimização',status:'backlog'},
    {mod:6,n:2,title:'Deploy na Vercel',status:'backlog'},
    {mod:6,n:3,title:'QR code: protótipo no celular da pessoa',status:'backlog'},
    {mod:6,n:4,title:'Responsive sem dor',status:'backlog'},
    {mod:6,n:5,title:'Apresentação, feedback e case study',status:'backlog'},
  ];

  const COLS=[
    {key:'backlog',name:'Backlog'},
    {key:'roteiro',name:'Roteiro'},
    {key:'gravacao',name:'Gravação'},
    {key:'edicao',name:'Edição'},
    {key:'publicacao',name:'Publicação'},
  ];

  const lessonDate=l=>l.date||(l.status==='publicacao'?'no ar':(FORECAST[l.mod]||'a definir'));

  // Monta o board
  const board=document.getElementById('cronBoard');
  COLS.forEach(col=>{
    const colEl=document.createElement('div');
    colEl.className='cron-col';
    colEl.dataset.col=col.key;
    const head=document.createElement('div');
    head.className='cron-col-head';
    head.innerHTML=`<span class="cron-col-name">${col.name}</span><span class="cron-col-count" data-count="${col.key}">0</span>`;
    const body=document.createElement('div');
    body.className='cron-col-body';
    const items=lessons.filter(l=>l.status===col.key);
    items.forEach(l=>{
      const card=document.createElement('article');
      card.className='cron-card';
      const hasMod=l.mod!=null;
      card.dataset.mod=hasMod?l.mod:'';
      card.style.setProperty('--m',hasMod?MOD_COLORS[l.mod]:'#9c9180');
      const pill=hasMod?`<span class="cron-mod">Módulo ${l.mod}</span>`:'<span></span>';
      const foot=hasMod?`${l.n?('Aula '+l.n+' · '):''}${MODULES[l.mod]}`:'Vídeo do curso';
      card.innerHTML=`<div class="cron-card-top">${pill}<span class="cron-date">${lessonDate(l)}</span></div>`+
        `<p class="cron-card-title">${l.title}</p>`+
        `<span class="cron-card-num">${foot}</span>`;
      body.appendChild(card);
    });
    const empty=document.createElement('div');
    empty.className='cron-empty';
    empty.textContent='vazio';
    body.appendChild(empty);
    colEl.appendChild(head);
    colEl.appendChild(body);
    board.appendChild(colEl);
  });

  // Filtros por módulo
  const filters=document.getElementById('cronFilters');
  const mkChip=(mod,label)=>{
    const b=document.createElement('button');
    b.className='cron-chip'+(mod==='all'?' is-on':'');
    b.dataset.mod=mod;
    if(mod!=='all'){b.style.setProperty('--m',MOD_COLORS[mod]);b.innerHTML=`<span class="dot"></span>${label}`;}
    else b.textContent=label;
    return b;
  };
  filters.appendChild(mkChip('all','Todos'));
  [0,1,2,3,4,5,6].forEach(m=>filters.appendChild(mkChip(String(m),'Módulo '+m)));

  const recount=()=>{
    COLS.forEach(col=>{
      const colEl=board.querySelector(`.cron-col[data-col="${col.key}"]`);
      const cards=[...colEl.querySelectorAll('.cron-card')];
      const visible=cards.filter(c=>!c.hidden).length;
      colEl.querySelector('[data-count]').textContent=visible;
      const empty=colEl.querySelector('.cron-empty');
      empty.style.display=visible===0?'flex':'none';
    });
  };

  const applyFilter=mod=>{
    board.querySelectorAll('.cron-card').forEach(c=>{
      c.hidden=!(mod==='all'||c.dataset.mod===mod);
    });
    recount();
  };

  filters.addEventListener('click',e=>{
    const chip=e.target.closest('.cron-chip');
    if(!chip)return;
    filters.querySelectorAll('.cron-chip').forEach(c=>c.classList.remove('is-on'));
    chip.classList.add('is-on');
    applyFilter(chip.dataset.mod);
  });

  // Stats / progresso
  const total=lessons.length;
  const published=lessons.filter(l=>l.status==='publicacao').length;
  const pct=Math.round(published/total*100);
  document.getElementById('cronProgressLabel').innerHTML=`<strong>${published}</strong>/${total} aulas · ${pct}%`;
  document.getElementById('cronTotal').textContent=`${total} aulas`;
  requestAnimationFrame(()=>{document.getElementById('cronProgressBar').style.width=pct+'%';});

  recount();

  /* ===== Sons de clique (chips e botões) ===== */
  const soundSel='.btn, .cron-chip';
  const sndDown=new Audio('mouse-down.wav');
  const sndUp=new Audio('mouse-up.wav');
  sndDown.preload='auto';sndUp.preload='auto';sndDown.volume=0.55;sndUp.volume=0.55;
  const playSnd=a=>{try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}};
  let sndArmed=false;
  document.addEventListener('mousedown',e=>{
    if(e.button!==0||!e.target.closest)return;
    if(e.target.closest(soundSel)){sndArmed=true;playSnd(sndDown)}
  },{passive:true});
  document.addEventListener('mouseup',()=>{if(sndArmed){sndArmed=false;playSnd(sndUp)}},{passive:true});

  /* ===== Cursor customizado ===== */
  const cursor=document.querySelector('.cursor');
  const canHover=matchMedia('(hover:hover) and (pointer:fine)').matches;
  const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(cursor&&canHover&&!reduceMotion){
    document.body.classList.add('has-custom-cursor');
    let tx=0,ty=0,rafId=null;
    const update=()=>{cursor.style.transform=`translate3d(${tx}px,${ty}px,0)`;rafId=null};
    document.addEventListener('mousemove',e=>{
      tx=e.clientX;ty=e.clientY-2;
      if(!rafId)rafId=requestAnimationFrame(update);
      if(!cursor.classList.contains('is-active'))cursor.classList.add('is-active');
    },{passive:true});
    document.addEventListener('mouseleave',()=>cursor.classList.remove('is-active'));
    document.addEventListener('mouseenter',()=>cursor.classList.add('is-active'));
    document.addEventListener('mousedown',()=>cursor.classList.add('is-down'));
    document.addEventListener('mouseup',()=>cursor.classList.remove('is-down'));
    const interactiveSel='a,button,[role="button"],.cron-chip,.cron-card';
    document.addEventListener('mouseover',e=>{
      if(e.target.closest&&e.target.closest(interactiveSel))cursor.classList.add('is-hover');
    });
    document.addEventListener('mouseout',e=>{
      const to=e.relatedTarget;
      if(!e.target.closest)return;
      const fromInt=e.target.closest(interactiveSel);
      const toInt=to&&to.closest&&to.closest(interactiveSel);
      if(fromInt&&!toInt)cursor.classList.remove('is-hover');
    });
  }
});
</script>
</body>
